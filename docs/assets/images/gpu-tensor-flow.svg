<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">Animated abstract tensor flow mesh</title>
  <desc id="desc">An abstract green polygon mesh with animated packets moving through irregular node links.</desc>
  <defs>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7a8" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#70bd44" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2f8f2f" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#efffd8"/>
      <stop offset="38%" stop-color="#9bd564"/>
      <stop offset="100%" stop-color="#4caa36"/>
    </radialGradient>
    <radialGradient id="packetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c7f9ad"/>
      <stop offset="100%" stop-color="#5bb83f"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="meshShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4d8e37" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .cell {
        fill: #a7d96c;
        opacity: 0.06;
        stroke: #6fbd43;
        stroke-width: 1.5;
        stroke-linejoin: round;
      }
      .edge {
        fill: none;
        stroke: url(#edgeGrad);
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.78;
      }
      .edgeSoft {
        fill: none;
        stroke: #8fce60;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.38;
      }
      .edgePulse {
        fill: none;
        stroke: #d9f99d;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 7 16;
        opacity: 0.75;
        animation: dash 2.9s linear infinite;
      }
      .node {
        fill: #73bd43;
        stroke: #dcfce7;
        stroke-width: 1.5;
      }
      .shine {
        fill: #c8ef8f;
        opacity: 0.7;
        pointer-events: none;
      }
      .packet {
        fill: #d9f99d;
        stroke: #ffffff;
        stroke-width: 1.3;
        filter: url(#glow);
      }
      .trail {
        fill: none;
        stroke: #bbf7a8;
        stroke-width: 9;
        stroke-linecap: round;
        opacity: 0.12;
      }
      @keyframes dash {
        to { stroke-dashoffset: -46; }
      }
    </style>
  </defs>

  <rect class="bg" width="520" height="320" rx="22"/>

  <g filter="url(#meshShadow)">
    <!-- Irregular polygon cells -->
    <polygon class="cell" points="122,150 174,78 244,102 218,166"/>
    <polygon class="cell" points="244,102 318,70 384,122 304,152"/>
    <polygon class="cell" points="122,150 218,166 186,240 104,214"/>
    <polygon class="cell" points="218,166 304,152 338,228 248,246 186,240"/>
    <polygon class="cell" points="304,152 384,122 424,202 338,228"/>
    <polygon class="cell" points="174,78 254,42 318,70 244,102"/>
    <polygon class="cell" points="186,240 248,246 286,280 158,274"/>

    <!-- Main mesh paths used by animation -->
    <path id="routeA" class="trail" d="M84 194 C124 150 150 110 174 78 C206 56 226 48 254 42 C290 48 304 57 318 70 C355 88 371 103 384 122 C405 154 414 178 424 202 C396 217 370 225 338 228 C306 246 278 258 286 280"/>
    <path id="routeB" class="trail" d="M104 214 C145 211 174 204 218 166 C250 156 274 151 304 152 C333 143 358 132 384 122"/>
    <path id="routeC" class="trail" d="M158 274 C176 252 182 236 186 240 C204 214 213 190 218 166 C227 138 235 118 244 102 C264 84 289 75 318 70"/>
    <path id="routeD" class="trail" d="M122 150 C158 150 188 156 218 166 C248 180 277 200 338 228 C363 220 395 209 424 202"/>

    <path class="edge" d="M84 194 L122 150 L174 78 L254 42 L318 70 L384 122 L424 202 L338 228 L286 280 L248 246 L158 274 L104 214 Z"/>
    <path class="edge" d="M122 150 L218 166 L304 152 L384 122"/>
    <path class="edge" d="M174 78 L244 102 L318 70"/>
    <path class="edge" d="M104 214 L186 240 L248 246 L338 228"/>
    <path class="edgeSoft" d="M244 102 L218 166 L186 240"/>
    <path class="edgeSoft" d="M244 102 L304 152 L338 228"/>
    <path class="edgeSoft" d="M254 42 L244 102 L304 152 L424 202"/>
    <path class="edgeSoft" d="M122 150 L186 240 L286 280"/>
    <path class="edgeSoft" d="M174 78 L218 166 L248 246"/>
    <path class="edgeSoft" d="M318 70 L304 152 L286 280"/>

    <path class="edgePulse" d="M84 194 L122 150 L174 78 L254 42 L318 70 L384 122 L424 202"/>
    <path class="edgePulse" d="M104 214 L186 240 L248 246 L338 228 L424 202" style="animation-delay: .6s"/>
    <path class="edgePulse" d="M174 78 L244 102 L304 152 L338 228" style="animation-delay: 1.1s"/>

    <!-- Nodes -->
    <g><circle class="node" cx="84" cy="194" r="12"/><circle class="shine" cx="80" cy="189" r="4"/></g>
    <g><circle class="node" cx="122" cy="150" r="15"/><circle class="shine" cx="117" cy="144" r="5"/></g>
    <g><circle class="node" cx="174" cy="78" r="17"/><circle class="shine" cx="168" cy="71" r="6"/></g>
    <g><circle class="node" cx="254" cy="42" r="13"/><circle class="shine" cx="250" cy="37" r="4"/></g>
    <g><circle class="node" cx="318" cy="70" r="16"/><circle class="shine" cx="313" cy="64" r="5"/></g>
    <g><circle class="node" cx="384" cy="122" r="17"/><circle class="shine" cx="378" cy="115" r="6"/></g>
    <g><circle class="node" cx="424" cy="202" r="15"/><circle class="shine" cx="419" cy="196" r="5"/></g>
    <g><circle class="node" cx="338" cy="228" r="18"/><circle class="shine" cx="332" cy="221" r="6"/></g>
    <g><circle class="node" cx="286" cy="280" r="12"/><circle class="shine" cx="282" cy="275" r="4"/></g>
    <g><circle class="node" cx="248" cy="246" r="16"/><circle class="shine" cx="243" cy="240" r="5"/></g>
    <g><circle class="node" cx="158" cy="274" r="15"/><circle class="shine" cx="153" cy="268" r="5"/></g>
    <g><circle class="node" cx="104" cy="214" r="16"/><circle class="shine" cx="99" cy="208" r="5"/></g>
    <g><circle class="node" cx="218" cy="166" r="18"/><circle class="shine" cx="212" cy="159" r="6"/></g>
    <g><circle class="node" cx="244" cy="102" r="15"/><circle class="shine" cx="239" cy="96" r="5"/></g>
    <g><circle class="node" cx="304" cy="152" r="15"/><circle class="shine" cx="299" cy="146" r="5"/></g>
    <g><circle class="node" cx="186" cy="240" r="12"/><circle class="shine" cx="182" cy="235" r="4"/></g>

    <!-- Moving tensor packets -->
    <circle class="packet" r="6">
      <animateMotion dur="5.4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeA"/>
      </animateMotion>
    </circle>
    <circle class="packet" r="5">
      <animateMotion dur="5.4s" begin="1.35s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeA"/>
      </animateMotion>
    </circle>
    <circle class="packet" r="5">
      <animateMotion dur="3.7s" begin=".4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeB"/>
      </animateMotion>
    </circle>
    <circle class="packet" r="5">
      <animateMotion dur="4.2s" begin=".85s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeC"/>
      </animateMotion>
    </circle>
    <circle class="packet" r="7">
      <animateMotion dur="4.0s" begin="1.1s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeD"/>
      </animateMotion>
    </circle>
    <rect class="packet" width="12" height="12" rx="3" transform="translate(-6 -6)">
      <animateMotion dur="4.8s" begin="1.75s" repeatCount="indefinite" rotate="auto">
        <mpath href="#routeB"/>
      </animateMotion>
    </rect>
  </g>
</svg>
